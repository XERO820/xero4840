<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05030f"/>
      <stop offset="100%" stop-color="#14092e"/>
    </linearGradient>
    <linearGradient id="xGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMergeevent </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <g filter="url(#glow)">
    <path d="M 130 130 L 382 382" stroke="url(#xGrad)" stroke-width="46" stroke-linecap="round" fill="none"/>
    <path d="M 382 130 L 130 382" stroke="url(#xGrad)" stroke-width="46" stroke-linecap="round" fill="none"/>
  </g>
  <g>
    <path d="M 130 130 L 382 382" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/>
    <path d="M 382 130 L 130 382" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35"/>
  </g>
  <circle cx="420" cy="92" r="14" fill="#ec4899" filter="url(#glow)"/>
</svg>
